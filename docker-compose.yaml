services:
  front:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conecta-senior-front
    networks:
      - conecta-senior-network
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:8080

  front-dev:
    image: node:20-alpine
    container_name: conecta-senior-front-dev
    working_dir: /app
    networks:
      - conecta-senior-network
    ports:
      - "5174:5173"
    environment:
      VITE_API_URL: http://backend:8080
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    stdin_open: true
    tty: true

networks:
  conecta-senior-network:
    external: true
    name: conecta-senior-network
